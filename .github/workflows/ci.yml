name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: no job here needs to write to the repo or its API.
permissions:
  contents: read

jobs:
  # Server unit/integration tests (node:test). The existence guard this job
  # carried before M6 is gone: server/package.json now exists, so a missing
  # server is a real failure rather than a state to tolerate.
  #
  # Node 22 is pinned to match docs/plan/README.md's fixed-versions table. The
  # dev container happens to run 24, so this job is the only place the pinned
  # runtime is actually exercised — do not float it to `lts/*`.
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm ci
        working-directory: server
        run: npm ci

      - name: npm test
        working-directory: server
        run: npm test

  # Client build + Catch2 tests via ctest. JUCE itself is cached across runs
  # (a full clone+build is expensive); only the apt system libraries JUCE
  # links against on Linux are installed fresh every run.
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # JUCE Linux build dependencies, per docs/setup.md.
      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            ninja-build

      - name: Cache JUCE install
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: ~/juce-install
          key: juce-8.0.12-ubuntu24

      # Only runs on a cache miss: build JUCE 8.0.12 from source and install
      # it to ~/juce-install so cmake --install can be cached wholesale
      # instead of rebuilding JUCE (slow) on every CI run.
      - name: Build and install JUCE 8.0.12
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch 8.0.12 --depth 1 https://github.com/juce-framework/JUCE.git "${{ runner.temp }}/juce-src"
          cmake -S "${{ runner.temp }}/juce-src" -B "${{ runner.temp }}/juce-build" -G Ninja -DCMAKE_INSTALL_PREFIX="$HOME/juce-install"
          cmake --build "${{ runner.temp }}/juce-build"
          cmake --install "${{ runner.temp }}/juce-build"

      - name: Configure client
        run: cmake -S client -B client/build/linux -G Ninja -DCMAKE_PREFIX_PATH="$HOME/juce-install"

      - name: Build client
        run: cmake --build client/build/linux

      - name: Run client tests
        run: ctest --test-dir client/build/linux --output-on-failure

  # Style check (docs/plan/05-testing.md CI section).
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          # Version-pinned to match .devcontainer/Dockerfile exactly (see DEVIATIONS.md 2026-08-07).
          sudo apt-get install -y clang-format-18=1:18.1.3-1ubuntu1

      - name: Check formatting
        run: |
          # client/tests may not exist yet (pre-M1 scaffolding); find with
          # -o -false-style patterns would still error on an empty result set
          # from `find`, so only pass clang-format any files that actually exist.
          # `|| true` keeps a missing directory from tripping Actions' implicit
          # set -e before the empty-check below can run.
          files=$(find client/src client/tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "No C++ source files found to format-check."
            exit 0
          fi
          clang-format-18 --dry-run --Werror $files
